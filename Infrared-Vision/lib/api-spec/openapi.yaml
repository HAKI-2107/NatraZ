openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scene
    description: Remote-sensing scene analysis
  - name: integrations
    description: Optional service diagnostics and alert testing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze-scene:
    post:
      operationId: analyzeScene
      tags: [scene]
      summary: Analyze a remote-sensing scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSceneRequest"
      responses:
        "200":
          description: Structured scene analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeSceneResponse"
        "400":
          description: Invalid request
        "503":
          description: AI provider is not configured
  /mcp/status:
    get:
      operationId: getMcpStatus
      tags: [integrations]
      summary: Get safe integration status
      responses:
        "200":
          description: Integration status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpStatus"
  /agentphone/verify:
    get:
      operationId: verifyAgentPhone
      tags: [integrations]
      summary: Verify AgentPhone configuration
      responses:
        "200":
          description: Safe AgentPhone status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPhoneVerification"
  /agentphone/alert:
    post:
      operationId: sendAgentPhoneAlert
      tags: [integrations]
      summary: Send a test AgentPhone alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPhoneAlertRequest"
      responses:
        "200":
          description: Alert result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPhoneAlertResponse"
        "400":
          description: Invalid request
        "503":
          description: AgentPhone unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeSceneRequest:
      type: object
      properties:
        image:
          type: string
          description: Optional supported image data URL for the visible viewport
        imageBase64:
          type: string
          description: Optional raw base64 image payload
        mimeType:
          type: string
          pattern: "^image/(jpeg|jpg|png|webp)$"
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        center:
          type: object
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
          required: [lat, lng]
        zoom: { type: number, minimum: 1, maximum: 22, default: 14 }
        band: { type: string, default: ai_color }
        bandMode: { type: string }
        composite: { type: string, default: default }
        filterDescription: { type: string }
        mapProvider: { type: string, default: esri }
        viewport:
          type: object
          properties:
            width: { type: integer, minimum: 1 }
            height: { type: integer, minimum: 1 }
      required: [center]
    AnalyzeSceneResponse:
      type: object
      properties:
        success: { type: boolean }
        result:
          type: object
          additionalProperties: true
      required: [success, result]
    SafeIntegrationStatus:
      type: object
      properties:
        provider: { type: string }
        connected: { type: boolean }
        configured: { type: boolean }
        status:
          type: string
          enum: [connected, configured, not_configured, error]
        reason: { type: string }
      required: [provider, connected, configured, status]
    McpStatus:
      type: object
      properties:
        railway: { $ref: "#/components/schemas/SafeIntegrationStatus" }
        cloudflare: { $ref: "#/components/schemas/SafeIntegrationStatus" }
        openai: { $ref: "#/components/schemas/SafeIntegrationStatus" }
        googleMaps: { $ref: "#/components/schemas/SafeIntegrationStatus" }
        agentPhone: { $ref: "#/components/schemas/SafeIntegrationStatus" }
        timestamp: { type: string, format: date-time }
      required: [railway, cloudflare, openai, googleMaps, agentPhone, timestamp]
    AgentPhoneAlertRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
        message: { type: string, minLength: 1, maxLength: 480 }
        channel: { type: string, enum: [sms, voice], default: sms }
      required: [phoneNumber, message]
    AgentPhoneVerification:
      type: object
      properties:
        connected: { type: boolean }
        authenticated: { type: boolean }
        configured: { type: boolean }
        provider: { type: string }
        phoneNumbers:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
            required: [number]
        reason: { type: string }
        timestamp: { type: string, format: date-time }
      required: [connected, authenticated, configured, provider, phoneNumbers, timestamp]
    AgentPhoneAlertResponse:
      type: object
      properties:
        success: { type: boolean }
        channel: { type: string, enum: [sms, voice] }
        messageId: { type: string }
        providerStatus: { type: string }
        reason: { type: string }
        timestamp: { type: string, format: date-time }
      required: [success, channel, timestamp]

