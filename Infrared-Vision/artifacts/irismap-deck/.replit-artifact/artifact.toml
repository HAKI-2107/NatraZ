kind = "slides"
previewPath = "/irismap-deck/"
title = "IrisMap Slide Deck"
version = "1.0.0"
id = "artifacts/irismap-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/irismap-deck/" ]
localPort = 25775

[services.development]
run = "pnpm --filter @workspace/irismap-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/irismap-deck", "run", "build" ]
publicDir = "artifacts/irismap-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25775"
BASE_PATH = "/irismap-deck/"
